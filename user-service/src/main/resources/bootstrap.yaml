spring:
  application:
    name: user-service # 服务名称
  profiles:
    active: dev
  cloud:
    inetutils:
      preferred-networks: 192.168.31 # 优先使用与虚拟机同网段的网卡，避免注册到VMware虚拟网卡IP
    nacos:
      server-addr: 192.168.31.129 # nacos地址
      config:
        file-extension: yaml # 文件后缀名
        shared-configs: # 共享配置
          - dataId: shared-log.yaml # 共享日志配置
          - dataId: shared-swagger.yaml # 共享接口文档配置
          - dataId: shared-seata.yaml # 共享分布式事务配置
